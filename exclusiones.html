<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwaplyGR - Paso 3</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/exclusiones.css">
</head>
<body data-page="paso3">
  <header class="topbar">
    <div class="container py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
      <div>
        <h1 class="m-0 h3 fw-bold">SwaplyGR</h1>
        <p class="m-0 topbar-sub">Sistema web de intercambio de regalos</p>
      </div>
    </div>
  </header>

  <nav class="step-nav">
    <div class="container py-2 d-flex flex-wrap gap-2">
      <a class="btn btn-sm btn-step step-link" data-step="paso1" href="index.html">1 Organizador</a>
      <a class="btn btn-sm btn-step step-link" data-step="paso2" href="participantes.html">2 Participantes</a>
      <a class="btn btn-sm btn-step step-link" data-step="paso3" href="exclusiones.html">3 Exclusiones</a>
      <a class="btn btn-sm btn-step step-link" data-step="paso4" href="evento.html">4 Evento</a>
      <a class="btn btn-sm btn-step step-link" data-step="paso5" href="acciones.html">5 Acciones</a>
      <a class="btn btn-sm btn-step step-link" data-step="paso6" href="datos.html">6 Datos</a>
      <a class="btn btn-sm btn-step step-link" data-step="paso7" href="sorteo.html">7 Sorteo</a>
    </div>
  </nav>

  <main class="container py-4">
    <section class="flow-block">
      <div class="flow-note">
        <h2>El sistema pregunta si hay exclusiones</h2>
        <p>Si hay exclusiones, selecciona que pares no deben sortearse entre si.</p>
      </div>
      <div class="phone-card">
        <div class="phone-top"></div>
        <div class="phone-body">
          <h3 class="screen-title">Quieres excluir ciertos sorteos?</h3>
          <select id="hayExclusiones" class="form-select mb-2">
            <option value="no">No establecer exclusiones</option>
            <option value="si">Establecer exclusiones</option>
          </select>
          <div class="exclusion-controls d-none">
            <select id="selectPersonaA" class="form-select mb-2"></select>
            <select id="selectPersonaB" class="form-select mb-2"></select>
            <button id="btnAgregarExclusion" type="button" class="btn btn-outline-secondary w-100 mb-2">Agregar exclusion</button>
          </div>
          <ul id="listaExclusiones" class="list-group mb-3"></ul>
          <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary w-100" href="participantes.html">Atras</a>
            <a id="btnContinuarPaso3" class="btn btn-main w-100" href="evento.html">Continuar</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/exclusiones.js"></script>
</body>
</html>
