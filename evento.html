<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwaplyGR - Paso 4</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="paso4">
  <header class="topbar">
    <div class="container py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
      <div>
        <h1 class="m-0 h3 fw-bold">SwaplyGR</h1>
        <p class="m-0 topbar-sub">Sistema web de intercambio de regalos</p>
      </div>
    </div>
  </header>

  <nav class="step-nav">
    <div class="container py-2 d-flex flex-wrap gap-2">
      <a class="btn btn-sm btn-step step-link" data-step="paso1" href="index.html">1 Organizador</a>
      <a class="btn btn-sm btn-step step-link" data-step="paso2" href="participantes.html">2 Participantes</a>
      <a class="btn btn-sm btn-step step-link" data-step="paso3" href="exclusiones.html">3 Exclusiones</a>
      <a class="btn btn-sm btn-step step-link" data-step="paso4" href="evento.html">4 Evento</a>
      <a class="btn btn-sm btn-step step-link" data-step="paso5" href="acciones.html">5 Acciones</a>
      <a class="btn btn-sm btn-step step-link" data-step="paso6" href="datos.html">6 Datos</a>
      <a class="btn btn-sm btn-step step-link" data-step="paso7" href="sorteo.html">7 Sorteo</a>
    </div>
  </nav>

  <main class="container py-4">
    <section class="flow-block">
      <div class="flow-note">
        <h2>Tipo de evento, fecha y presupuesto</h2>
        <p>Selecciona celebracion, fecha sugerida o calendario y cuanto gastar.</p>
      </div>
      <div class="phone-card">
        <div class="phone-top"></div>
        <div class="phone-body">
          <h3 class="screen-title">Para que vas a sortear nombres?</h3>
          <label for="tipoEvento" class="form-label">Tipo de evento</label>
          <select id="tipoEvento" class="form-select mb-2">
            <option value="Navidad">Navidad</option>
            <option value="Cumpleanos">Cumpleanos</option>
            <option value="Posada">Posada</option>
            <option value="Aniversario">Aniversario</option>
            <option value="otro">Mostrar mas</option>
          </select>
          <div id="contenedorEventoPersonalizado" class="d-none">
            <input id="eventoPersonalizado" type="text" class="form-control mb-2" placeholder="Nombre de la celebracion">
          </div>
          <label for="fechaSugerida" class="form-label">Fechas cercanas</label>
          <select id="fechaSugerida" class="form-select mb-2"></select>
          <label for="fechaManual" class="form-label">O elige en calendario</label>
          <input id="fechaManual" type="date" class="form-control mb-2">
          <label for="presupuesto" class="form-label">Presupuesto</label>
          <select id="presupuesto" class="form-select mb-2">
            <option value="100">$100</option>
            <option value="200">$200</option>
            <option value="300">$300</option>
            <option value="500">$500</option>
            <option value="otro">Otra cantidad</option>
          </select>
          <div id="contenedorPresupuestoPersonalizado" class="d-none">
            <input id="presupuestoPersonalizado" type="number" min="1" class="form-control mb-2" placeholder="Monto personalizado">
          </div>
          <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary w-100" href="exclusiones.html">Atras</a>
            <a class="btn btn-main w-100" href="acciones.html">Continuar</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
