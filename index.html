<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwaplyGR - Paso 1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/inicio.css">
</head>
<body data-page="paso1">
  <header class="topbar">
    <div class="container py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
      <div class="d-flex align-items-center gap-2">
        <img src="img/logosw.png" alt="Logotipo de SwaplyGR" class="brand-logo">
        <div>
          <h1 class="m-0 h3 fw-bold">SwaplyGR</h1>
          <p class="m-0 topbar-sub">Sistema web de intercambio de regalos</p>
        </div>
      </div>
    </div>
  </header>

  <nav class="step-nav">
    <div class="container py-2 d-flex flex-wrap gap-2">
      <a class="btn btn-sm btn-step step-link" data-step="paso1" href="index.html">1 Organizador</a>
      <a class="btn btn-sm btn-step step-link" data-step="paso2" href="participantes.html">2 Participantes</a>
      <a class="btn btn-sm btn-step step-link" data-step="paso3" href="exclusiones.html">3 Exclusiones</a>
      <a class="btn btn-sm btn-step step-link" data-step="paso4" href="evento.html">4 Evento</a>
      <a class="btn btn-sm btn-step step-link" data-step="paso5" href="acciones.html">5 Acciones</a>
      <a class="btn btn-sm btn-step step-link" data-step="paso6" href="datos.html">6 Datos</a>
      <a class="btn btn-sm btn-step step-link" data-step="paso7" href="sorteo.html">7 Sorteo</a>
    </div>
  </nav>

  <main class="container py-4">
    <section class="flow-block">
      <div class="flow-note">
        <h2>Quien organiza el intercambio?</h2>
        <p>Indicar si se incluye o no en el intercambio.</p>
      </div>
      <div class="phone-card">
        <div class="phone-top"></div>
        <div class="phone-body">
          <h3 class="screen-title">Cual es tu nombre?</h3>
          <input id="nombreOrganizador" type="text" class="form-control mb-2" placeholder="Ejemplo: Gina">
          <label for="incluyeOrganizador" class="form-label">Incluyeme (el organizador) en el sorteo</label>
          <select id="incluyeOrganizador" class="form-select mb-3">
            <option value="si">Si</option>
            <option value="no">No</option>
          </select>
          <a id="btnContinuarPaso1" class="btn btn-main" href="participantes.html">Continuar</a>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/organizador.js"></script>
</body>
</html>
